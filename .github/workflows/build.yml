name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew buildActive

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: prism-ui-jar
          path: build/libs/*/*.jar
